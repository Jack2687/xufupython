name: xufupython
services:
  postgres:
    image: postgres:18-bookworm
    container_name: xufupython-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xufupython
      POSTGRES_USER: xufupython
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U xufupython -d xufupython"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]
  app:
    image: xufupython-app:${APP_VERSION:-latest}
    build:
      context: .
      args:
        VCS_REF: ${APP_VERSION:-local}
    container_name: xufupython-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5496:18970"
    environment:
      DATABASE_URL: postgresql://xufupython:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/xufupython
      MASTER_KEY: ${MASTER_KEY:?Set MASTER_KEY; preserve it when migrating data}
      APP_WORKER_MODE: ${APP_WORKER_MODE:-all}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD for an empty database}
      TZ: Asia/Shanghai
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 130s
    networks: [private]
networks:
  private:
volumes:
  postgres_data:
